name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish, already pushed
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, ext: .exe, bundles: nsis }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x64, ext: "", bundles: "deb,appimage" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, ext: "", bundles: dmg }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x64, ext: "", bundles: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the binary and its installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: src-tauri

      - name: Package
        shell: bash
        run: |
          dir="claude-session-widget-${TAG}-${{ matrix.name }}"
          mkdir "$dir"
          cp "src-tauri/target/${{ matrix.target }}/release/ClaudeSessionWidget${{ matrix.ext }}" "$dir/"
          cp README.md "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir"
            archive="$dir.zip"
          else
            tar czf "$dir.tar.gz" "$dir"
            archive="$dir.tar.gz"
          fi
          mkdir out
          mv "$archive" out/
          for f in src-tauri/target/${{ matrix.target }}/release/bundle/*/*; do
            base=$(basename "$f")
            case "$base" in
              *-setup.exe) suffix=setup.exe ;;
              *.deb | *.AppImage | *.dmg) suffix="${base##*.}" ;;
              *) continue ;;
            esac
            cp "$f" "out/claude-session-widget-${TAG}-${{ matrix.name }}.$suffix"
          done
          echo "Packaged:"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
